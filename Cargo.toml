[package]
name = "mtsc"
version = "0.4.0-gpu.1"
edition = "2021"
autotests = false
autobenches = false
description = "RouterOS L6 Serial Generator & License Key Converter"

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "mtsc"
path = "src/main.rs"
test = false
bench = false

[features]
# Default: build.rs probes the local toolchain and compiles the CUDA backend when a
# CUDA toolkit (nvcc) is found; the Metal backend compiles on macOS targets. Without
# a toolchain the build is CPU-only. CI passes --no-default-features for lean
# portable CPU artifacts; GPU binaries are local builds by policy.
default = ["gpu-auto"]
gpu-auto = ["dep:cudarc", "cudarc/cuda-version-from-build-system", "cudarc/fallback-latest"]
# Explicit force switches (override detection; runtime still degrades gracefully
# when the required libraries are absent).
cuda = ["dep:cudarc", "cudarc/cuda-version-from-build-system", "cudarc/fallback-latest"]
metal = []

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
cudarc = { version = "0.19", optional = true }
curve25519-dalek = "4"
serde = { version = "1", features = ["derive"] }
toml = "1"

# Always present on macOS (the Metal toolchain ships with the OS SDK); the backend
# module itself is gated by the gpu-auto/metal features in src/gpu/mod.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-metal = "0.3"

[profile.release]
opt-level = 3
lto = true
