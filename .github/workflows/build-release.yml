name: Cross-platform build and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
      - "[0-9]*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Validate artifact version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve filename-safe version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              printf 'Unsupported release tag: %s; expected [v]MAJOR.MINOR.PATCH[-prerelease][+build]\n' "$REF_NAME" >&2
              exit 1
            fi
            package_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
            if [[ "${REF_NAME#v}" != "$package_version" ]]; then
              printf 'Tag %s does not match Cargo.toml version %s\n' "$REF_NAME" "$package_version" >&2
              exit 1
            fi
            version="$REF_NAME"
          else
            version="${GITHUB_SHA:0:7}"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  build:
    name: Build ${{ matrix.platform }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      BUILD_VERSION: ${{ needs.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Show toolchain
        run: rustc -vV

      - name: Lint library and CLI
        run: cargo clippy --lib --bins --target ${{ matrix.target }} -- -D warnings

      - name: Check generic CPU build on Apple Silicon
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          RUSTFLAGS: -C target-cpu=generic
          CARGO_TARGET_DIR: target-generic
        run: cargo check --lib --bins --target ${{ matrix.target }} --no-default-features

      - name: Build portable release executable
        # CPU-only lean build: GPU backends need the local toolchain (CUDA/Metal) and
        # are local builds by policy — the distributed binaries stay GPU-free.
        run: cargo build --release --target ${{ matrix.target }} --no-default-features

      - name: Package Linux and macOS archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package="mtsc-$BUILD_VERSION-$PLATFORM"
          mkdir -p "dist/$package"
          cp "target/$TARGET/release/mtsc" README.md LICENSE keys.example.toml "dist/$package/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          cd dist
          if [[ "$RUNNER_OS" == macOS ]]; then
            shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
          else
            sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
          fi

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "mtsc-$env:BUILD_VERSION-$env:PLATFORM"
          $stage = Join-Path "dist" $package
          $archive = Join-Path "dist" "$package.zip"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/mtsc.exe" $stage
          Copy-Item "README.md", "LICENSE", "keys.example.toml" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtsc-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [format, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mtsc-*
          merge-multiple: true
          path: dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
